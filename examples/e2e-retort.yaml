schema:
  types:
    dcim.manufacturer:
      key:
        slug:
          type: slug
      fields:
        name:
          type: string
        slug:
          type: slug
    dcim.device_role:
      key:
        slug:
          type: slug
      fields:
        name:
          type: string
        slug:
          type: slug
    dcim.device_type:
      key:
        slug:
          type: slug
      fields:
        manufacturer:
          type: ref
          target: dcim.manufacturer
        model:
          type: string
        slug:
          type: slug
    dcim.site:
      key:
        slug:
          type: slug
      fields:
        name:
          type: string
        slug:
          type: slug
        status:
          type: string
    dcim.device:
      key:
        name:
          type: slug
      fields:
        name:
          type: string
        site:
          type: ref
          target: dcim.site
        role:
          type: ref
          target: dcim.device_role
        device_type:
          type: ref
          target: dcim.device_type
        status:
          type: string
        firmware_version:
          type: string
        tags:
          type: list
          item:
            type: string
    dcim.interface:
      key:
        name:
          type: slug
      fields:
        name:
          type: string
        device:
          type: ref
          target: dcim.device
        if_type:
          type: string
        enabled:
          type: bool
    ipam.prefix:
      key:
        prefix:
          type: prefix
      fields:
        prefix:
          type: prefix
        site:
          type: ref
          target: dcim.site
        description:
          type: string
    ipam.ip_address:
      key:
        address:
          type: ip_address
      fields:
        address:
          type: ip_address
        assigned_interface:
          type: ref
          target: dcim.interface
        description:
          type: string
    ops.service:
      key:
        name:
          type: slug
      fields:
        name:
          type: string
        environment:
          type: enum
          values:
            - prod
            - stage
        owner:
          type: string
        description:
          type: string
    ops.service_instance:
      key:
        name:
          type: slug
      fields:
        name:
          type: string
        service:
          type: ref
          target: ops.service
        device:
          type: ref
          target: dcim.device
        primary_ip:
          type: ref
          target: ipam.ip_address
        interfaces:
          type: list_ref
          target: dcim.interface
        role:
          type: enum
          values:
            - edge
            - core
        config:
          type: json
    ops.deployment:
      key:
        name:
          type: slug
      fields:
        name:
          type: string
        service:
          type: ref
          target: ops.service
        instances:
          type: list_ref
          target: ops.service_instance
        prefix:
          type: ref
          target: ipam.prefix
        enabled:
          type: bool
        notes:
          type: string
rules: []
