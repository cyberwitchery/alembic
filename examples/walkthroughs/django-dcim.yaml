# for docs/examples/03-django-dcim.md: a minimal model the django backend turns
# into a runnable django app (models, admin, serializers, urls).
schema:
  types:
    dcim.site:
      key: {slug: {type: slug}}
      fields: {name: {type: string}, slug: {type: slug}}
    dcim.device:
      key: {name: {type: slug}}
      fields:
        name: {type: slug}
        site: {type: ref, target: dcim.site}
objects:
  - uid: "11111111-1111-1111-1111-111111111111"
    type: dcim.site
    key: {slug: "lab1"}
    attrs: {name: "lab1", slug: "lab1"}
  - uid: "22222222-2222-2222-2222-222222222222"
    type: dcim.device
    key: {name: "leaf01"}
    attrs: {name: "leaf01", site: "11111111-1111-1111-1111-111111111111"}
