# a trimmed vendor-neutral fabric for docs/case-studies/01-evaluate-dcim-systems.md:
# one site, one device, one interface, one ip. the case study stands this same
# model up into netbox and nautobot from one source of truth.
schema:
  types:
    dcim.site:
      key: {slug: {type: slug}}
      fields: {name: {type: string}, slug: {type: slug}}
    dcim.device:
      key: {name: {type: slug}}
      fields:
        name: {type: slug}
        site: {type: ref, target: dcim.site}
        role: {type: ref, target: dcim.device_role}
        device_type: {type: ref, target: dcim.device_type}
    dcim.device_role:
      key: {slug: {type: slug}}
      fields:
        name: {type: string}
        slug: {type: slug}
    dcim.device_type:
      key: {slug: {type: slug}}
      fields:
        slug: {type: slug}
        model: {type: string}
        manufacturer: {type: ref, target: dcim.manufacturer}
    dcim.manufacturer:
      key: {slug: {type: slug}}
      fields:
        name: {type: string}
        slug: {type: slug}
    dcim.interface:
      # unique per device, so the key is (device, name).
      key:
        device: {type: ref, target: dcim.device}
        name: {type: slug}
      fields:
        name: {type: slug}
        device: {type: ref, target: dcim.device}
        type: {type: string}
    ipam.ip_address:
      key: {address: {type: ip_address}}
      fields:
        address: {type: ip_address}
        assigned_interface: {type: ref, target: dcim.interface}
objects:
