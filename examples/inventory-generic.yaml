# inventory for the generic rest adapter (see examples/generic.yaml, docs/generic.md).
# the adapter sends an object's attrs and rebuilds its key from what the api returns, so
# each key field is declared in `fields:` and carried in `attrs:` as well.
schema:
  types:
    services.vpn:
      key:
        vpn:
          type: slug
      fields:
        vpn:
          type: slug
        peers:
          type: json
        pre_shared_key:
          type: string
    dcim.site:
      key:
        site:
          type: slug
      fields:
        site:
          type: slug
        name:
          type: string
        slug:
          type: slug
objects:
  - uid: "00000000-0000-0000-0000-000000000001"
    type: services.vpn
    key:
      vpn: "corp"
    attrs:
      vpn: "corp"
      peers:
        - name: site1
          ip: 10.0.0.1
        - name: site2
          ip: 10.0.0.2
      pre_shared_key: "secret"
  - uid: "00000000-0000-0000-0000-000000000002"
    type: dcim.site
    key:
      site: "fra1"
    attrs:
      site: "fra1"
      name: "FRA1"
      slug: "fra1"
