# generic rest adapter config, pointed at by `config_path` in a generic backend
# config (see docs/cli.md). each key under `types` is an ir type name and `path`
# is appended to `base_url`; written for examples/inventory-generic.yaml.
base_url: http://localhost:8080/api
headers:
  Authorization: Token generic_xxx_replace_me
types:
  services.vpn:
    path: /services/vpns/
    results_path: results
    delete_strategy: standard
  dcim.site:
    path: /dcim/sites/
    results_path: results
    delete_strategy: standard
