name: ci

# last match wins in a paths filter, so markdown is out except the skill
# crates/alembic-cli/src/app/skill.rs include_str!s into the binary.
on:
  push:
    branches: ["main"]
    paths: ["**", "!**/*.md", "crates/alembic-cli/skills/**"]
  pull_request:
    branches: ["main"]
    paths: ["**", "!**/*.md", "crates/alembic-cli/skills/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint-and-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # needs no toolchain, so it runs before the cargo setup
      - name: Release publish list
        run: scripts/check-publish-list.sh

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alembic-ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny

      - name: cargo-deny
        run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    # a stable-toolchain bump misses the cargo cache, and a job the budget
    # cancels never saves one, so the budget has to cover a cold build.
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
      ALEMBIC_DJANGO_PYTHON: python
      ALEMBIC_TEST_POSTGRES_URL: postgres://alembic:alembic@localhost:5432/alembic
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alembic
          POSTGRES_USER: alembic
          POSTGRES_PASSWORD: alembic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alembic -d alembic"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install Django deps
        run: |
          python -m pip install --upgrade pip
          # drf still imports cc_delim_re, which django 6.1 removed; drop the pin when drf supports 6.1
          python -m pip install 'django<6.1' djangorestframework django-filter drf-spectacular

      - name: Provision postgres state table
        env:
          PGPASSWORD: alembic
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U alembic -d alembic -c "
            CREATE TABLE IF NOT EXISTS alembic_state (
              state_key TEXT PRIMARY KEY,
              payload JSONB NOT NULL,
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alembic-ci

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-llvm-cov

      - name: Coverage
        run: |
          cargo build --examples
          cargo llvm-cov --workspace --all-features --fail-under-lines 80 \
            --ignore-filename-regex "netbox\\.rs/" \
            --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alembic-ci

      - name: Build docs
        run: cargo doc --workspace --no-deps

  agents:
    name: agents
    runs-on: ubuntu-latest
    # scripts/agent_fixtures.sh drives the contract the embedded skill states
    # through the cli, offline: the exercises are seconds, the budget is the
    # build. this is the only job that links a runnable binary -- lint caches
    # check artifacts and coverage caches instrumented ones -- so it codegens
    # the cli's whole dependency tree and needs a cache of its own to reuse.
    timeout-minutes: 40
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alembic-agents

      - name: Build the cli
        run: cargo build -p alembic-cli

      - name: Agent fixtures
        run: ALEMBIC="$PWD/target/debug/alembic" scripts/agent_fixtures.sh

  unsafe-budget:
    name: unsafe-budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: alembic-ci

      - uses: cyberwitchery/unsafe-budget@d10776ba7fe8043f31b19ec40bcff26b4da6b94e # v0.5.1
        with:
          mode: check
          version: v0.5.1

  sbom:
    name: sbom
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@64ffd6a08c3e9626a681c8be1c8ad056765f3b85 # main
    with:
      mode: report

  success:
    name: success
    needs: [lint, coverage, doc, agents, unsafe-budget, sbom]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
