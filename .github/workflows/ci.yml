name: ci

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: lint-and-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: alembic-ci

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint (clippy)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - uses: taiki-e/install-action@cargo-deny

      - name: cargo-deny
        run: cargo deny check

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
      ALEMBIC_CAST_PYTHON: python
      ALEMBIC_TEST_POSTGRES_URL: postgres://alembic:alembic@localhost:5432/alembic
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: alembic
          POSTGRES_USER: alembic
          POSTGRES_PASSWORD: alembic
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U alembic -d alembic"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Django deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install django djangorestframework

      - name: Provision postgres state table
        env:
          PGPASSWORD: alembic
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql -h localhost -U alembic -d alembic -c "
            CREATE TABLE IF NOT EXISTS alembic_state (
              state_key TEXT PRIMARY KEY,
              payload JSONB NOT NULL,
              updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
            );"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: alembic-ci

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage
        run: |
          cargo build --examples
          cargo llvm-cov --workspace --all-features --fail-under-lines 80 \
            --ignore-filename-regex "netbox\\.rs/" \
            --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

  doc:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: alembic-ci

      - name: Build docs
        run: cargo doc --workspace --no-deps

  success:
    name: success
    needs: [lint, coverage, doc]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: check results
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            exit 1
          fi
