name: review-482

on:
  push:
    branches: ["scratch/482-review-fmt"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Apply review fixes
        run: python scripts/review_482.py
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          components: rustfmt
      - name: Format
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
      - name: SDK summary test
        run: cargo test -p alembic-adapter-sdk provision_report_summary_honors_tense
      - name: CLI provisioning summary tests
        run: cargo test -p alembic-cli --test provision_summary
      - name: Package formatted files
        run: |
          mkdir -p /tmp/review-482/crates/alembic-adapter-sdk/src
          mkdir -p /tmp/review-482/crates/alembic-cli/src/app
          cp crates/alembic-adapter-sdk/src/types.rs /tmp/review-482/crates/alembic-adapter-sdk/src/types.rs
          cp crates/alembic-cli/src/app/mod.rs /tmp/review-482/crates/alembic-cli/src/app/mod.rs
          cp CHANGELOG.md /tmp/review-482/CHANGELOG.md
      - name: Upload formatted files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: review-482-formatted
          path: /tmp/review-482
