name: release

on:
  push:
    tags:
      - "v*"
  # rebuild and re-upload binaries for an existing release tag without
  # re-publishing crates (e.g. after fixing a binary-build failure).
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to build binaries for (e.g. v0.7.0)"
        required: true

jobs:
  publish:
    # crates are published only on the tag push, never on a manual binaries rebuild.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-release
          cache-targets: true

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo doc --workspace --all-features --no-deps

      # tests run on every push via ci.yml's coverage job (cargo llvm-cov
      # --workspace), and the release tag points at a tested commit; the release
      # job does not recompile them in test mode (which OOMs the runner building
      # the large generated netbox-openapi dependency).

      - name: install sbom tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          for manifest in "$GITHUB_WORKSPACE"/crates/*/Cargo.toml; do
            crate="$(basename "$(dirname "$manifest")")"
            (cd /tmp && cargo cyclonedx --manifest-path "$manifest" \
              --format json \
              --override-filename "sbom-${REF_NAME}-${crate}.cdx" \
              --all-features)
          done

      - name: collect sbom files
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/alembic-sbom
          find /tmp -maxdepth 1 -type f -name "sbom-${REF_NAME}-*.cdx.json" \
            -exec mv {} /tmp/alembic-sbom/ \;
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${REF_NAME}-*.cdx.json" \
            -exec mv {} /tmp/alembic-sbom/ \;

      - name: prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/release-notes.md"
          changelog="${GITHUB_WORKSPACE}/CHANGELOG.md"
          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\[" version "\\]" { in_section = 1; print; next }
            $0 ~ "^## " version "([[:space:]]|$|-)" { in_section = 1; print; next }
            $0 ~ "^## " && in_section { exit }
            in_section { print }
          ' "$changelog" > "$out"
          if [ ! -s "$out" ]; then
            echo "release notes for version $version not found in $changelog" >&2
            exit 1
          fi

      - name: upload sbom
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/alembic-sbom/sbom-${{ github.ref_name }}-*.cdx.json"
          if-no-files-found: error

      - name: attach sbom to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: /tmp/alembic-sbom/sbom-${{ github.ref_name }}-*.cdx.json

      - name: publish alembic-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-core --no-verify

      - name: publish alembic-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-engine --no-verify

      - name: publish alembic-adapter-netbox
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-netbox --no-verify

      - name: publish alembic-adapter-nautobot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-nautobot --no-verify

      - name: publish alembic-adapter-infrahub
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-infrahub --no-verify

      - name: publish alembic-adapter-generic
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-generic --no-verify

      - name: publish alembic-adapter-peeringdb
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-peeringdb --no-verify

      - name: publish alembic-adapter-django
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-django --no-verify

      - name: publish alembic-adapter-registry
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-registry --no-verify

      - name: publish alembic-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-cli --no-verify

      - name: publish alembic-adapter-test
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-test --no-verify

  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
      # the generated netbox/nautobot openapi crates are memory-hungry to compile
      # and OOM the 7GB linux runners; serializing codegen lowers peak memory (the
      # linux jobs also add swap below).
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      # tag to build for: the pushed tag, or the workflow_dispatch input.
      REF: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # both mac targets build on the apple-silicon runner (it cross-compiles
          # x86_64 fine); the intel macos-13 runner is unreliable to schedule.
          - target: x86_64-apple-darwin
            os: macos-14
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.REF }}

      - name: add swap (linux)
        if: runner.os == 'Linux'
        # the runner already has an active /swapfile, so add a second one on the
        # larger /mnt disk for extra headroom during the openapi-crate compile.
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-binaries
          key: ${{ matrix.target }}
          cache-targets: true

      - name: build binaries
        run: cargo build --release --locked -p alembic-cli -p alembic-adapter-test --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          for bin in alembic alembic-adapter-test; do
            dir="${bin}-${REF}-${{ matrix.target }}"
            mkdir "$dir"
            cp "target/ci/${{ matrix.target }}/release/${bin}" "$dir/"
            cp README.md "$dir/"
            tar czf "${dir}.tar.gz" "$dir"
          done

      - name: attach binaries to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.REF }}
          files: "*-${{ env.REF }}-${{ matrix.target }}.tar.gz"
