name: release

on:
  push:
    tags:
      - "v*"
  # rebuild and re-upload binaries for an existing release tag without
  # re-publishing crates (e.g. after fixing a binary-build failure).
  workflow_dispatch:
    inputs:
      tag:
        description: "existing release tag to build binaries for (e.g. v0.7.0)"
        required: true

permissions: {}

jobs:
  sbom:
    name: sbom
    # gates the release on the approved sboms and attests every crate. a manual
    # binaries rebuild skips it.
    if: github.event_name == 'push'
    uses: cyberwitchery/.github/.github/workflows/sbom.yml@d8cdf87f9048c369e1ab49281da13e7e72a782fb # main
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      mode: release

  publish:
    # crates are published only on the tag push, never on a manual binaries rebuild.
    if: github.event_name == 'push'
    needs: sbom
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo doc --workspace --all-features --no-deps

      # tests run on every push via ci.yml's coverage job (cargo llvm-cov
      # --workspace), and the release tag points at a tested commit; the release
      # job does not recompile them in test mode (which OOMs the runner building
      # the large generated netbox-openapi dependency).

      - name: prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/release-notes.md"
          changelog="${GITHUB_WORKSPACE}/CHANGELOG.md"
          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\[" version "\\]" { in_section = 1; print; next }
            $0 ~ "^## " version "([[:space:]]|$|-)" { in_section = 1; print; next }
            $0 ~ "^## " && in_section { exit }
            in_section { print }
          ' "$changelog" > "$out"
          if [ ! -s "$out" ]; then
            echo "release notes for version $version not found in $changelog" >&2
            exit 1
          fi

      - name: download sbom
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-evidence
          path: ${{ runner.temp }}/evidence

      - name: attach sbom to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: ${{ runner.temp }}/evidence/release/*.cdx.json

      - name: publish alembic-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-core --no-verify

      - name: publish alembic-adapter-sdk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-sdk --no-verify

      - name: publish alembic-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-engine --no-verify

      - name: publish alembic-adapter-netbox
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-netbox --no-verify

      - name: publish alembic-adapter-nautobot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-nautobot --no-verify

      - name: publish alembic-adapter-infrahub
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-infrahub --no-verify

      - name: publish alembic-adapter-generic
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-generic --no-verify

      - name: publish alembic-adapter-peeringdb
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-peeringdb --no-verify

      - name: publish alembic-adapter-django
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-django --no-verify

      - name: publish alembic-adapter-registry
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-registry --no-verify

      - name: publish alembic-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-cli --no-verify

      - name: publish alembic-adapter-test
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-test --no-verify

  binaries:
    name: binaries (${{ matrix.target }})
    needs: sbom
    # a manual rebuild skips sbom; a tag push only ships binaries once it passed.
    if: ${{ !cancelled() && (needs.sbom.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.sbom.result == 'skipped')) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
      # the generated netbox/nautobot openapi crates are memory-hungry to compile
      # and OOM the 7GB linux runners; serializing codegen lowers peak memory (the
      # linux jobs also add swap below).
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      # tag to build for: the pushed tag, or the workflow_dispatch input.
      REF: ${{ inputs.tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # both mac targets build on the apple-silicon runner (it cross-compiles
          # x86_64 fine); the intel macos-13 runner is unreliable to schedule.
          - target: x86_64-apple-darwin
            os: macos-15
          - target: aarch64-apple-darwin
            os: macos-15
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.REF }}

      - name: add swap (linux)
        if: runner.os == 'Linux'
        # the runner already has an active /swapfile, so add a second one on the
        # larger /mnt disk for extra headroom during the openapi-crate compile.
        run: |
          sudo fallocate -l 8G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h

      - name: set up rust
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: build binaries
        run: cargo build --release --locked -p alembic-cli -p alembic-adapter-test --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          for bin in alembic alembic-adapter-test; do
            dir="${bin}-${REF}-${{ matrix.target }}"
            mkdir "$dir"
            cp "target/ci/${{ matrix.target }}/release/${bin}" "$dir/"
            cp README.md "$dir/"
            tar czf "${dir}.tar.gz" "$dir"
          done

      - name: attest binaries
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "*-${{ env.REF }}-${{ matrix.target }}.tar.gz"

      - name: attach binaries to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.REF }}
          files: "*-${{ env.REF }}-${{ matrix.target }}.tar.gz"
