name: release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-release
          cache-targets: true

      - name: doc build
        env:
          RUSTDOCFLAGS: "--cfg docsrs"
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo doc --workspace --all-features --no-deps

      # tests run on every push via ci.yml's coverage job (cargo llvm-cov
      # --workspace), and the release tag points at a tested commit; the release
      # job does not recompile them in test mode (which OOMs the runner building
      # the large generated netbox-openapi dependency).

      - name: install sbom tool
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-cyclonedx

      - name: generate sbom
        run: |
          for manifest in "$GITHUB_WORKSPACE"/crates/*/Cargo.toml; do
            crate="$(basename "$(dirname "$manifest")")"
            (cd /tmp && cargo cyclonedx --manifest-path "$manifest" \
              --format json \
              --override-filename "sbom-${{ github.ref_name }}-${crate}.cdx" \
              --all-features)
          done

      - name: collect sbom files
        run: |
          set -euo pipefail
          mkdir -p /tmp/alembic-sbom
          find /tmp -maxdepth 1 -type f -name "sbom-${{ github.ref_name }}-*.cdx.json" \
            -exec mv {} /tmp/alembic-sbom/ \;
          find "$GITHUB_WORKSPACE" -type f -name "sbom-${{ github.ref_name }}-*.cdx.json" \
            -exec mv {} /tmp/alembic-sbom/ \;

      - name: prepare release notes from changelog
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          out="${RUNNER_TEMP}/release-notes.md"
          changelog="${GITHUB_WORKSPACE}/CHANGELOG.md"
          awk -v version="$version" '
            BEGIN { in_section = 0 }
            $0 ~ "^## \\[" version "\\]" { in_section = 1; print; next }
            $0 ~ "^## " version "([[:space:]]|$|-)" { in_section = 1; print; next }
            $0 ~ "^## " && in_section { exit }
            in_section { print }
          ' "$changelog" > "$out"
          if [ ! -s "$out" ]; then
            echo "release notes for version $version not found in $changelog" >&2
            exit 1
          fi

      - name: upload sbom
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.ref_name }}
          path: "/tmp/alembic-sbom/sbom-${{ github.ref_name }}-*.cdx.json"
          if-no-files-found: error

      - name: attach sbom to release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ runner.temp }}/release-notes.md
          files: /tmp/alembic-sbom/sbom-${{ github.ref_name }}-*.cdx.json

      - name: publish alembic-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-core --no-verify

      - name: publish alembic-engine
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-engine --no-verify

      - name: publish alembic-adapter-netbox
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-netbox --no-verify

      - name: publish alembic-adapter-nautobot
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-nautobot --no-verify

      - name: publish alembic-adapter-infrahub
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-infrahub --no-verify

      - name: publish alembic-adapter-generic
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-generic --no-verify

      - name: publish alembic-adapter-peeringdb
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-peeringdb --no-verify

      - name: publish alembic-adapter-django
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-django --no-verify

      - name: publish alembic-adapter-registry
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-adapter-registry --no-verify

      - name: publish alembic-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p alembic-cli --no-verify

  binaries:
    name: binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      RUSTFLAGS: "-C debuginfo=0"
      CARGO_TARGET_DIR: target/ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-13
          - target: aarch64-apple-darwin
            os: macos-14
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: set up rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-binaries
          key: ${{ matrix.target }}
          cache-targets: true

      - name: build alembic-cli
        run: cargo build --release --locked -p alembic-cli --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          dir="alembic-cli-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/ci/${{ matrix.target }}/release/alembic-cli" "$dir/"
          cp README.md "$dir/"
          tar czf "${dir}.tar.gz" "$dir"
          echo "ASSET=${dir}.tar.gz" >> "$GITHUB_ENV"

      - name: attach binary to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ASSET }}
