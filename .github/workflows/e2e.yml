name: e2e

# the live-backend check: netbox and infrahub in docker, driven through the
# cli by scripts/e2e_netbox_infrahub.sh. too slow for every push, so it runs
# weekly, on demand, and on a pull request that changes what it runs.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/e2e.yml"
      - "scripts/e2e_netbox_infrahub.sh"
      - "scripts/infrahubctl_docker.sh"
      - "docker-compose.netbox.yml"
      - "docker/**"
      - "examples/e2e.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  e2e:
    name: netbox and infrahub
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RUSTFLAGS: "-C debuginfo=0"
    steps:
      # the infrahub and netbox images need the room.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: alembic-e2e

      # built before the backends start, so the script's `cargo run`s are warm.
      - name: Build the cli
        run: cargo build -p alembic-cli

      - name: e2e
        run: scripts/e2e_netbox_infrahub.sh

      - name: Backend logs
        if: failure()
        run: |
          docker compose -f docker-compose.netbox.yml logs --tail 200 || true
          for compose in /tmp/infrahub-compose-*.yml; do
            docker compose -f "$compose" logs --tail 200 || true
          done
