# base.yaml with the device's ref holding the backend's own id instead of the
# site's uid. it does not validate.
include:
  - schema.yaml
schema:
  types: {}
objects:
  - uid: "11111111-1111-1111-1111-111111111111"
    type: dcim.site
    key:
      slug: "fra1"
    attrs:
      name: "FRA1"
      slug: "fra1"
      description: "primary site"
  - uid: "22222222-2222-2222-2222-222222222222"
    type: dcim.device
    key:
      name: "leaf01"
    attrs:
      name: "leaf01"
      site: 1
