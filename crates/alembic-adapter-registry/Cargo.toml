[package]
name = "alembic-adapter-registry"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/alembic-adapter-registry"
description = "Adapter registry and configuration for Alembic."
readme = "../../README.md"

[features]
netbox = ["dep:alembic-adapter-netbox"]
nautobot = ["dep:alembic-adapter-nautobot"]
infrahub = ["dep:alembic-adapter-infrahub"]
generic = ["dep:alembic-adapter-generic"]
peeringdb = ["dep:alembic-adapter-peeringdb"]
django = ["dep:alembic-adapter-django"]
default = []
all = ["netbox", "nautobot", "infrahub", "generic", "peeringdb", "django"]

[dependencies]
alembic-core.workspace = true
alembic-engine.workspace = true
alembic-adapter-netbox = { workspace = true, optional = true }
alembic-adapter-nautobot = { workspace = true, optional = true }
alembic-adapter-infrahub = { workspace = true, optional = true }
alembic-adapter-generic = { workspace = true, optional = true }
alembic-adapter-peeringdb = { workspace = true, optional = true }
alembic-adapter-django = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }
