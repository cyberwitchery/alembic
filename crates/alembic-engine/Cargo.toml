[package]
name = "alembic-engine"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/alembic-engine"
description = "Planning, apply, and state engine for Alembic."
readme = "../../README.md"

[features]
# user-defined map template transforms written in starlark. off by default so
# library consumers keep a lean dependency tree; the cli enables it.
starlark = ["dep:starlark"]

[dependencies]
alembic-core.workspace = true
starlark = { workspace = true, optional = true }
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
thiserror.workspace = true
tokio.workspace = true
uuid.workspace = true
tokio-postgres.workspace = true
native-tls.workspace = true
postgres-native-tls.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
futures = { workspace = true }
