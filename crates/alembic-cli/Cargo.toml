[package]
name = "alembic-cli"
version = "0.9.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/alembic-cli"
description = "Command line interface for Alembic."
readme = "../../README.md"

# the crate is published as `alembic-cli`, but the user-facing binary is `alembic`
# (matching every doc and the cli's own `--help`).
[[bin]]
name = "alembic"
path = "src/main.rs"

[dependencies]
alembic-core.workspace = true
alembic-engine = { workspace = true, features = ["starlark"] }
alembic-adapter-registry = { workspace = true, features = ["all"] }
alembic-adapter-django.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
figment.workspace = true
serde.workspace = true
reqwest.workspace = true
machine-uid.workspace = true
sha2.workspace = true

[dev-dependencies]
httpmock = { workspace = true }
tempfile = { workspace = true }
uuid.workspace = true
